<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作例④ AWS構成図ビューワー（デモ）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 0.35rem;
      height: 0.35rem;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 0.25rem;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 p-2.5 sm:p-4 custom-scrollbar min-h-screen">

  <div class="w-full max-w-[1540px] mx-auto space-y-2.5">

    <!-- ヘッダーエリア -->
    <header class="bg-white px-5 py-3.5 rounded-xl border border-slate-200/80 shadow-xs flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">☁️</span>
        <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">
          AWS ECSコンテナ構成（Cloud Design Pattern）
        </h1>
      </div>

      <div class="flex items-center gap-2 text-sm text-slate-500 font-mono">
        <span class="bg-slate-50 border border-slate-200 px-3 py-1 rounded font-bold">
          ノード: <strong id="node-count" class="text-slate-800 font-bold">0</strong>
        </span>
        <span class="bg-slate-50 border border-slate-200 px-3 py-1 rounded font-bold">
          接続線: <strong id="conn-count" class="text-slate-800 font-bold">0</strong>
        </span>
      </div>
    </header>

    <!-- タブ切り替えバー -->
    <div class="flex items-center justify-between gap-3 border-b border-slate-200 pb-2.5">
      <div class="flex items-center gap-2.5">
        <button id="btn-diagram" class="px-4 py-2 bg-sky-600 text-white font-bold text-sm rounded-lg shadow-xs transition flex items-center gap-2 cursor-pointer">
          <span>☁️</span> アーキテクチャ図
        </button>
        <button id="btn-json" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 font-bold text-sm rounded-lg hover:bg-slate-50 transition flex items-center gap-2 cursor-pointer">
          <span>📜</span> 構成定義 (JSON)
        </button>
      </div>
    </div>

    <!-- メインレイアウト: 左Canvas ＋ 右インスペクタ -->
    <div id="diagram-view-layout" class="flex flex-col lg:flex-row gap-3 items-start w-full relative">

      <!-- 左側: Canvas 構成図表示領域 -->
      <div class="flex-1 w-full bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs flex flex-col gap-1.5 min-w-0">
        <div class="relative w-full h-[630px] bg-slate-50/50 rounded-lg overflow-hidden border border-slate-200">
          <canvas id="diagram-canvas" class="w-full h-full block cursor-pointer"></canvas>
        </div>
      </div>

      <!-- 右側: 詳細パラメータパネル（インスペクタ） -->
      <div class="w-full lg:w-[410px] shrink-0 bg-white p-4.5 rounded-xl border border-slate-200/80 shadow-xs flex flex-col gap-3 custom-scrollbar overflow-y-auto h-[656px]">
        <!-- パネルヘッダー -->
        <div class="border-b border-slate-200 pb-2.5 flex items-center justify-between">
          <div class="text-sm font-bold text-slate-900 flex items-center gap-2">
            <span class="text-base">🔍</span> リソース詳細パラメータ
          </div>
          <span id="select-badge" class="text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-mono font-bold">未選択</span>
        </div>

        <!-- パラメータ詳細表示コンテンツ -->
        <div id="inspector-content" class="flex flex-col gap-3 text-sm">
          <!-- 動的挿入 -->
        </div>
      </div>

    </div>

    <!-- JSONビューワ コンテナ -->
    <section id="json-view-layout" class="hidden bg-slate-950 p-5 rounded-xl border border-slate-800 shadow-xs relative">
      <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-800">
        <span class="text-sm font-mono text-emerald-400 font-bold">
          aws_architecture.json
        </span>
        <button id="btn-copy-json" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs font-bold border border-slate-700 transition">
          📋 JSONをコピー
        </button>
      </div>
      <pre id="json-code" class="text-sm font-mono text-slate-300 overflow-auto max-h-[520px] leading-relaxed"></pre>
    </section>

  </div>

  <!-- レンダラー読み込み -->
  <script src="../../../Tools/aws-diagram/diagram_renderer.js"></script>

    window.addEventListener('load', () => {
      const renderer = new AwsDiagramRenderer({
        canvas: 'diagram-canvas',
        inspector: 'inspector-content',
        selectBadge: 'select-badge',
        nodeCount: 'node-count',
        connCount: 'conn-count'
      });

      renderer.setData(DIAGRAM_DATA, 'alb');
      renderer.scale = 0.82;
      renderer.offsetX = 15;
      renderer.offsetY = 15;
      renderer.render();

      // タブ切り替え制御
      const btnDiagram = document.getElementById('btn-diagram');
      const btnJson = document.getElementById('btn-json');
      const diagramLayout = document.getElementById('diagram-view-layout');
      const jsonLayout = document.getElementById('json-view-layout');
      const jsonCode = document.getElementById('json-code');

      jsonCode.textContent = JSON.stringify(DIAGRAM_DATA, null, 2);

      btnDiagram.addEventListener('click', () => {
        btnDiagram.className = "px-3.5 py-1.5 bg-sky-600 text-white font-bold text-xs rounded-lg shadow-xs transition flex items-center gap-1.5 cursor-pointer";
        btnJson.className = "px-3.5 py-1.5 bg-white border border-slate-300 text-slate-700 font-bold text-xs rounded-lg hover:bg-slate-50 transition flex items-center gap-1.5 cursor-pointer";
        diagramLayout.classList.remove('hidden');
        jsonLayout.classList.add('hidden');
      });

      btnJson.addEventListener('click', () => {
        btnJson.className = "px-3.5 py-1.5 bg-sky-600 text-white font-bold text-xs rounded-lg shadow-xs transition flex items-center gap-1.5 cursor-pointer";
        btnDiagram.className = "px-3.5 py-1.5 bg-white border border-slate-300 text-slate-700 font-bold text-xs rounded-lg hover:bg-slate-50 transition flex items-center gap-1.5 cursor-pointer";
        jsonLayout.classList.remove('hidden');
        diagramLayout.classList.add('hidden');
      });

      document.getElementById('btn-copy-json').addEventListener('click', () => {
        navigator.clipboard.writeText(JSON.stringify(DIAGRAM_DATA, null, 2)).then(() => {
          const btn = document.getElementById('btn-copy-json');
          btn.innerText = '✅ コピー完了！';
          setTimeout(() => btn.innerText = '📋 JSONをコピー', 2000);
        });
      });
    });
  </script>
</body>

</html>
