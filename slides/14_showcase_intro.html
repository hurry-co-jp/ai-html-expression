<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実際に試してみた表現の紹介</title>
  <link rel="stylesheet" href="../theme/slide_theme.css">
  <script src="../theme/slide_theme.js" defer></script>
  <style>
    .slide-content {
      padding: 3.5rem 5rem !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5rem;
      overflow: hidden;
    }

    .intro-badge-area {
      display: flex;
      align-items: center;
    }

    .section-pill {
      background: #e0f2fe;
      color: #0284c7;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 0.4rem 1.25rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    .main-message-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 3.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .title-recall {
      font-size: 3.0rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .title-recall span.highlight {
      color: #0284c7;
      border-bottom: 3px solid #38bdf8;
      padding-bottom: 2px;
    }

    .lead-text {
      font-size: 2.2rem;
      font-weight: 500;
      color: #475569;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="slide-container">
    <header class="slide-header">
      <h1>実際に試してみた表現の紹介</h1>
      <div class="slide-logo"></div>
    </header>

    <main class="slide-content">
      <div class="intro-badge-area">
        <span class="section-pill">後半パート：実践ギャラリー</span>
      </div>

      <div class="main-message-card">
        <div class="title-recall">
          今回のタイトルは、<br>
          <span class="highlight">「AIでHTMLにどこまで表現させられるかやってみた」</span> でした。
        </div>

        <div class="lead-text">
          ここからは、実際に試してみたものをざっくりと紹介していきます。<br>
          「こんなの作れるんだ」というアイデアとして持ち帰ってもらえるとよいかと思っています。
        </div>
      </div>
    </main>

    <footer class="slide-footer"></footer>
  </div>
</body>

</html>
