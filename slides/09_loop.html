<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思考サイクル</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/slide.js"></script>
    <style>
    .slide-content {
      padding: 0 !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <header class="slide-header">
      <h1>思考サイクル</h1>
      <div class="slide-logo"></div>
    </header>

    <main class="slide-content">
      <canvas id="slide-canvas"></canvas>
    </main>

    <footer class="slide-footer"></footer>
  </div>

  <script>
    const canvas = document.getElementById('slide-canvas');
    const ctx = canvas.getContext('2d');

    // 共通レイアウト規格（theme/canvas_theme.js）から展開
    const { SLIDE_WIDTH, SLIDE_HEIGHT, HEADER_HEIGHT, FOOTER_HEIGHT, CONTENT_WIDTH, CONTENT_HEIGHT } = window.CANVAS_LAYOUT;

    const stepsData = [
      {
        title: 'Markdown執筆',
        midDesc: 'レイアウトに縛られず、伝えたいアイデアを\nシンプルなMarkdownで素早く書き起こす',
        iconType: 'markdown'
      },
      {
        title: 'AIによるHTML生成',
        midDesc: '文脈や意図をAIが理解し、\n伝わりやすい表現・レイアウト（＋α）を自動生成',
        iconType: 'html'
      },
      {
        title: '視覚化と気づき',
        midDesc: '可視化された画面を見ることで、\n記述の不足や論理の甘さに直感的に気づく',
        iconType: 'chrome'
      },
      {
        title: 'Markdownの修整',
        midDesc: '得られた気づきをもとに思考を整理し、\n元のMarkdownの内容をブラッシュアップする',
        iconType: 'markdown'
      }
    ];

    function drawContent(ctx, baseWidth, baseHeight) {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, baseWidth, baseHeight);

      const cardW = 660;
      const cardH = 200;
      const leftColX = 90;
      const rightColX = baseWidth - 90 - cardW;
      const topY = 90;
      const bottomY = 470;

      // 左右のゾーン背景
      drawZone(ctx, leftColX - 25, 35, cardW + 50, 715, 'テキスト（思考と構造）', '#f8fafc', '#e2e8f0', '#0f172a');
      drawZone(ctx, rightColX - 25, 35, cardW + 50, 715, 'HTML（表現と可視化）', '#fffbeb', '#fed7aa', '#c2410c');

      // カード描画（Markdown, HTML5, Chrome, Markdown）
      drawBalancedCard(ctx, leftColX, topY, cardW, cardH, stepsData[0]);
      drawBalancedCard(ctx, rightColX, topY, cardW, cardH, stepsData[1]);
      drawBalancedCard(ctx, rightColX, bottomY, cardW, cardH, stepsData[2]);
      drawBalancedCard(ctx, leftColX, bottomY, cardW, cardH, stepsData[3]);

      // インフィニティ（∞）矢印（主語アイコン＆ステップ番号付き）
      // 1. 左上(01) ➔ 右上(02): 🤖 意図を汲んで生成
      drawDirectArrow(ctx, leftColX + cardW, topY + cardH / 2, rightColX, topY + cardH / 2, '意図を汲んで生成', 'ai', 255, 1);

      // 2. 右上(02) ➔ 右下(03): 画面にレンダリング（アイコンなし）
      drawDirectArrow(ctx, rightColX + cardW / 2, topY + cardH, rightColX + cardW / 2, bottomY, '画面にレンダリング', null, 205, 2);

      // 3. 右下(03) ➔ 左下(04): 🧑‍💻 フィードバック
      drawDirectArrow(ctx, rightColX, bottomY + cardH / 2, leftColX + cardW, bottomY + cardH / 2, 'フィードバック', 'user', 215, 3);

      // 4. 左下(04) ➔ 左上(01): 🧑‍💻 テキストを修整
      drawDirectArrow(ctx, leftColX + cardW / 2, bottomY, leftColX + cardW / 2, topY + cardH, 'テキストを修整', 'user', 225, 4);

      // 下部要約フッター
      drawSummaryFooter(ctx, 65, 780, baseWidth - 130, 90);
    }

    // バランス版カード
    function drawBalancedCard(ctx, x, y, w, h, data) {
      ctx.save();
      ctx.shadowColor = 'rgba(15, 23, 42, 0.05)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 7;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 18);
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // ブランド公式ロゴ描画
      const logoX = x + 50;
      const logoY = y + 42;
      if (data.iconType === 'markdown') {
        drawMarkdownLogo(ctx, logoX, logoY, 44);
      } else if (data.iconType === 'html') {
        drawHtmlLogo(ctx, logoX, logoY, 44);
      } else if (data.iconType === 'chrome') {
        drawChromeLogo(ctx, logoX, logoY, 44);
      }

      // タイトル
      ctx.font = 'bold 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(data.title, x + 92, y + 42);

      // 区切り線
      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x + 24, y + 82);
      ctx.lineTo(x + w - 24, y + 82);
      ctx.stroke();

      // 2行テキスト（midDesc）
      ctx.font = '24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.textBaseline = 'top';
      const lines = data.midDesc.split('\n');
      lines.forEach((ln, lIdx) => {
        ctx.fillText(ln, x + 28, y + 102 + lIdx * 38);
      });

      ctx.restore();
    }

    // ステップ番号バッジ描画（矢印バッジの左上にピン留め）
    function drawStepBadge(ctx, cx, cy, num) {
      ctx.save();
      ctx.shadowColor = 'rgba(15, 23, 42, 0.2)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;

      // ブルーの円（直径32px）
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fill();

      // 白い境界線
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.4;
      ctx.stroke();

      // ステップ番号テキスト
      ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(num, cx, cy + 0.5);

      ctx.restore();
    }

    // 1. Markdown公式ロゴ
    function drawMarkdownLogo(ctx, cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 24;
      ctx.scale(s, s);

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(-14, -10, 28, 20, 3.5);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.9;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(-10, 5.5);
      ctx.lineTo(-10, -4.5);
      ctx.lineTo(-6.5, -0.5);
      ctx.lineTo(-3, -4.5);
      ctx.lineTo(-3, 5.5);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(4, -4.5);
      ctx.lineTo(4, 5.5);
      ctx.moveTo(1.5, 3);
      ctx.lineTo(4, 5.5);
      ctx.lineTo(6.5, 3);
      ctx.stroke();

      ctx.restore();
    }

    // 2. HTML5公式ロゴ
    function drawHtmlLogo(ctx, cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 24;
      ctx.scale(s, s);

      ctx.fillStyle = '#e34f26';
      ctx.beginPath();
      ctx.moveTo(-10, -11);
      ctx.lineTo(0, -11);
      ctx.lineTo(0, 11);
      ctx.lineTo(-8.2, 8.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ef652a';
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.lineTo(10, -11);
      ctx.lineTo(8.2, 8.5);
      ctx.lineTo(0, 11);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('5', 0.5, 0.5);

      ctx.restore();
    }

    // 3. Google Chrome公式フルカラーロゴ
    function drawChromeLogo(ctx, cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      const r = size / 2;
      const innerR = r * 0.48;
      const centerR = r * 0.38;

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = '#ea4335';
      ctx.beginPath();
      ctx.arc(0, 0, r, -Math.PI * 5 / 6, -Math.PI / 6);
      ctx.lineTo(r, -r * 0.35);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fbbc05';
      ctx.beginPath();
      ctx.arc(0, 0, r, -Math.PI / 6, Math.PI / 2);
      ctx.lineTo(0, r);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#34a853';
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI / 2, -Math.PI * 5 / 6);
      ctx.lineTo(-r * 0.86, -r * 0.5);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, innerR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#4285f4';
      ctx.beginPath();
      ctx.arc(0, 0, centerR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ゾーン背景
    function drawZone(ctx, x, y, w, h, title, bg, border, titleColor) {
      ctx.save();
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 20);
      ctx.fill();
      ctx.strokeStyle = border;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.font = 'bold 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = titleColor;
      ctx.textAlign = 'center';
      ctx.fillText(title, x + w / 2, y + 36);
      ctx.restore();
    }

    // 矢印（主語アイコン付きバッジ＋ステップ番号）
    function drawDirectArrow(ctx, x1, y1, x2, y2, label, subjectType, badgeW, stepNum) {
      ctx.save();
      ctx.strokeStyle = '#0284c7';
      ctx.fillStyle = '#0284c7';
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - 16 * Math.cos(angle - Math.PI / 6), y2 - 16 * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - 16 * Math.cos(angle + Math.PI / 6), y2 - 16 * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      if (label) {
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        const bW = badgeW ? badgeW + 30 : 250;
        const bH = 48;

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(15, 23, 42, 0.08)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(midX - bW / 2, midY - bH / 2, bW, bH, 12);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = 'bold 23px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#0f172a';
        ctx.textBaseline = 'middle';

        if (subjectType === 'ai') {
          // 🤖 ロボット絵文字描画
          const emojiX = midX - bW / 2 + 18;
          ctx.save();
          ctx.font = '28px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('🤖', emojiX, midY + 2);
          ctx.restore();

          // テキスト
          ctx.textAlign = 'left';
          ctx.fillText(label, emojiX + 40, midY);
        } else if (subjectType === 'user') {
          // 🧑‍💻 エンジニア絵文字描画
          const emojiX = midX - bW / 2 + 18;
          ctx.save();
          ctx.font = '28px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('🧑‍💻', emojiX, midY + 2);
          ctx.restore();

          // テキスト
          ctx.textAlign = 'left';
          ctx.fillText(label, emojiX + 42, midY);
        } else {
          // アイコンなし（中央揃え）
          ctx.textAlign = 'center';
          ctx.fillText(label, midX, midY);
        }

        // 矢印バッジ左上角にステップ番号（1〜4）を配置
        if (stepNum) {
          drawStepBadge(ctx, midX - bW / 2 + 2, midY - bH / 2 + 2, stepNum);
        }
      }
      ctx.restore();
    }

    // 下部要約フッター
    function drawSummaryFooter(ctx, x, y, w, h) {
      ctx.save();
      ctx.fillStyle = '#f0f9ff';
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 18);
      ctx.fill();

      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ざっくり言うと「AIにいい感じに可視化させる ➔ いい感じじゃないと思ったところを明文化」を繰り返す', x + w / 2, y + h / 2);
      ctx.restore();
    }

    function render() {
      const container = canvas.parentElement;
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (!width || !height) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.scale(dpr, dpr);

      // メインエリア基準サイズ（1920 × 900）に対するスケーリング比率
      const scaleX = width / CONTENT_WIDTH;
      const scaleY = height / CONTENT_HEIGHT;
      const scale = Math.min(scaleX, scaleY);

      const offsetX = (width - CONTENT_WIDTH * scale) / 2;
      const offsetY = (height - CONTENT_HEIGHT * scale) / 2;

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      drawContent(ctx, CONTENT_WIDTH, CONTENT_HEIGHT);

      ctx.restore();
    }

    window.addEventListener('resize', render);
    window.addEventListener('load', render);
  </script>
</body>
</html>
