<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動紹介スライド</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .slide-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .placeholder {
      display: none;
      border: 2.5px dashed #cbd5e1;
      border-radius: 1.25rem;
      padding: 4rem 6rem;
      text-align: center;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .placeholder-title {
      font-size: 2.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .placeholder-desc {
      font-size: 1.4rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .placeholder-path {
      font-family: monospace;
      font-size: 1.3rem;
      color: #0284c7;
      background: #f1f5f9;
      padding: 0.6rem 1.4rem;
      border-radius: 0.5rem;
      border: 1px solid #e2e8f0;
      display: inline-block;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="slide-wrapper">
    <img src="../theme/department.png" alt="活動紹介スライド" class="slide-img"
      onerror="this.style.display='none'; document.getElementById('ph').style.display='block';">
    <div id="ph" class="placeholder">
      <div class="placeholder-title">活動紹介スライド</div>
      <div class="placeholder-desc">以下のパスに画像を配置すると自動的に全画面表示されます</div>
      <div class="placeholder-path">theme/department.png</div>
    </div>
  </div>
</body>

</html>
