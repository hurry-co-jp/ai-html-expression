<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デモ：HTML/CSS/JSだけで動く動画</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/slide.js"></script>
  <style>
    .slide-content {
      padding: 0.75rem 3.5rem 1.25rem 3.5rem !important;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    /* デモ埋め込みコンテナ（余計な装飾を排し全画面展開） */
    .demo-iframe-container {
      width: 100%;
      flex: 1;
      height: 100%;
      border: 1.5px solid #cbd5e1;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
      background: #ffffff;
    }

    iframe.demo-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <div class="slide-container">
    <header class="slide-header">
      <h1>デモ：HTML/CSS/JSだけで動く動画</h1>
      <div class="slide-logo"></div>
    </header>

    <main class="slide-content">
      <div class="demo-iframe-container">
        <iframe src="../demos/slide_music_video.html" class="demo-iframe" title="コード駆動型ミュージックビデオ"></iframe>
      </div>
    </main>

    <footer class="slide-footer"></footer>
  </div>
</body>

</html>
