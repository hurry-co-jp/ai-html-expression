<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIに言語化させた、今回のHTMLの良いポイント</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/slide.js"></script>
  <style>
    .slide-content {
      padding: 1.25rem 3.5rem 1.5rem 3.5rem !important;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow: hidden;
    }

    /* 個人差注記バナー */
    .disclaimer-banner {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 0.5rem 1.25rem;
      font-size: 1.2rem;
      font-weight: 500;
      color: #64748b;
    }

    .disclaimer-badge {
      background: #e0f2fe;
      color: #0284c7;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 0.3rem;
    }

    /* メリットカード縦5段リスト */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .benefit-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1.1rem 1.75rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .card-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      white-space: nowrap;
      min-width: 440px;
      margin: 0;
    }

    .card-body {
      font-size: 1.35rem;
      font-weight: 500;
      color: #475569;
      line-height: 1.5;
      margin: 0;
      text-wrap: pretty;
    }
  </style>
</head>

<body>
  <div class="slide-container">
    <header class="slide-header">
      <h1>AIに言語化させた、今回のHTMLの良いポイント</h1>
      <div class="slide-logo"></div>
    </header>

    <main class="slide-content">
      <!-- 注記バナー -->
      <div class="disclaimer-banner">
        <span class="disclaimer-badge">NOTE</span>
        <span>AIによるドキュメント再構成の視点（※ レイアウトの見やすさやデザインの好みには個人差があります）</span>
      </div>

      <!-- 5つのポイント縦5段並び -->
      <div class="cards-container">
        <div class="benefit-card">
          <h2 class="card-title">① 意思決定順に再構成</h2>
          <p class="card-body">検討事項を最上部へ配置し、議論の論点を明確化。</p>
        </div>

        <div class="benefit-card">
          <h2 class="card-title">② 現状と改善後の対比表</h2>
          <p class="card-body">散在していた課題と改善策を、プロセス別に対比表で整理。</p>
        </div>

        <div class="benefit-card">
          <h2 class="card-title">③ 重要数値のハイライト</h2>
          <p class="card-body">重要数値を大きく強調し、一瞬でコスト感を把握可能に。</p>
        </div>

        <div class="benefit-card">
          <h2 class="card-title">④ 多段組による一覧性</h2>
          <p class="card-body">画面幅を活かしたグリッド配置で、縦スクロールを大幅削減。</p>
        </div>

        <div class="benefit-card">
          <h2 class="card-title">⑤ 直感的なアーキテクチャ構成図</h2>
          <p class="card-body">テキスト図から、データの流れが直感的に伝わる構成図へ刷新。</p>
        </div>
      </div>
    </main>

    <footer class="slide-footer"></footer>
  </div>
</body>

</html>
