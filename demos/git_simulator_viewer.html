<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git シミュレーター（ステップ実行と領域変化の可視化）</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 22px;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0.45rem 0.75rem;
      gap: 0.35rem;
    }

    /* 上部ヘッダーバー（タイトル ＋ シチュエーション選択タブ） */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 0.55rem;
      padding: 0.3rem 0.65rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .app-logo {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .app-logo span {
      background: #0f172a;
      color: #ffffff;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.78rem;
    }

    /* シナリオ選択タブ */
    .scenario-tabs {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .scenario-tab-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      color: #475569;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 0.35rem;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      white-space: nowrap;
    }

    .scenario-tab-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .scenario-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
    }

    .scenario-tab-btn.trouble.active {
      background: #e11d48;
      border-color: #e11d48;
      box-shadow: 0 2px 4px rgba(225, 29, 72, 0.2);
    }

    /* ガイド・アラートバー（元デザイン完全準拠・スリム設計） */
    .incident-alert {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 0.55rem;
      padding: 0.35rem 0.75rem;
      flex-shrink: 0;
      gap: 0.85rem;
      border: 1.5px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .incident-alert.type-guide {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }
    .incident-alert.type-guide h3 { color: #0f172a; }
    .incident-alert.type-guide p { color: #475569; }

    .incident-alert.type-trouble {
      background-color: #fee2e2;
      border-color: #fca5a5;
    }
    .incident-alert.type-trouble h3 { color: #9f1239; }
    .incident-alert.type-trouble p { color: #b91c1c; }

    .incident-info {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .incident-info h3 {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .incident-info p {
      font-size: 0.78rem;
      line-height: 1.3;
    }

    .btn-reset {
      background: #ffffff;
      border: 1.5px solid var(--border-strong);
      color: #334155;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.3rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .btn-reset:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }

    /* メイン 3 カラムレイアウト（右カラム 480px 確保） */
    .main-grid {
      display: grid;
      grid-template-columns: 310px 1fr 480px;
      gap: 0.55rem;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* 【左カラム】ファイル状態 */
    .col-zones {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 0.55rem;
      padding: 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow-y: auto;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .col-zones-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: #334155;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25rem;
    }

    .zone-box {
      border-radius: 0.45rem;
      border: 1.5px solid #e2e8f0;
      padding: 0.35rem 0.55rem;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .zone-box.worktree {
      border-color: #fed7aa;
      background: #fffbeb;
    }

    .zone-box.staging {
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .zone-box.local {
      border-color: #bae6fd;
      background: #f0f9ff;
    }

    .zone-box.remote {
      border-color: #e9d5ff;
      background: #faf5ff;
    }

    .zone-header {
      display: flex;
      align-items: center;
    }

    .zone-name {
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .zone-box.worktree .zone-name { color: #b45309; }
    .zone-box.staging .zone-name { color: #15803d; }
    .zone-box.local .zone-name { color: #0369a1; }
    .zone-box.remote .zone-name { color: #7e22ce; }

    .zone-file-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-height: 1.4rem;
    }

    .file-chip {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      padding: 0.22rem 0.45rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0.3rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    /* 移動・追加されたファイルの赤枠ハイライト */
    .file-chip.moved {
      border: 2px solid #e11d48 !important;
      box-shadow: 0 0 0 1px rgba(225, 29, 72, 0.2);
    }

    .empty-note {
      font-size: 0.72rem;
      color: #94a3b8;
      font-style: italic;
      padding: 0.15rem 0;
    }

    /* 【中央カラム】コミットグラフ Canvas（縦全体を広く確保） */
    .col-canvas {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 0.55rem;
      padding: 0.55rem;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .card-header-canvas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25rem;
    }

    .card-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: #334155;
    }

    .canvas-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas#git-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 【右カラム】実行手順ステップ一覧（480px） */
    .col-steps {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 0.55rem;
      padding: 0.55rem;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .card-steps-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.35rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .steps-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding-right: 0.2rem;
    }

    /* 各ステップカード（縦折れ防止・最適化レイアウト） */
    .step-card {
      border: 1.5px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 0.5rem 0.65rem;
      background: #f8fafc;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .step-card.active {
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.12);
    }

    .step-card.completed {
      border-color: #bbf7d0;
      background: #f0fdf4;
      opacity: 0.9;
    }

    /* 1段目: タイトル（横幅100%確保） */
    .step-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
    }

    .step-number {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      background: #e2e8f0;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .step-card.active .step-number {
      background: #0284c7;
      color: #ffffff;
    }

    .step-card.completed .step-number {
      background: #16a34a;
      color: #ffffff;
    }

    .step-title-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      flex: 1;
    }

    /* 2段目: コマンド ＆ 実行アクション（横並び） */
    .step-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .step-code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: #0f172a;
      color: #38bdf8;
      padding: 0.35rem 0.6rem;
      border-radius: 0.35rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-exec {
      background: #0284c7;
      color: #ffffff;
      border: none;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 0.35rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px rgba(2, 132, 199, 0.3);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-exec:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .btn-exec:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .step-status-done {
      font-size: 0.76rem;
      font-weight: 700;
      color: #15803d;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 3段目: 解説テキスト */
    .step-explanation {
      font-size: 0.74rem;
      color: #475569;
      line-height: 1.35;
    }

    /* 達成完了バナー */
    .success-banner {
      display: none;
      background: #dcfce7;
      border: 1.5px solid #86efac;
      border-radius: 0.45rem;
      padding: 0.45rem 0.75rem;
      color: #14532d;
      margin-top: 0.3rem;
      align-items: center;
      gap: 0.5rem;
    }

    .success-banner h4 {
      font-size: 0.86rem;
      font-weight: 700;
    }

    .success-banner p {
      font-size: 0.76rem;
      color: #166534;
    }

    /* 薄型スクロールバー */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダーバー（タイトル ＋ シチュエーション選択タブ） -->
    <header>
      <div class="header-left">
        <div class="app-logo">
          <span>Git</span> シミュレーター
        </div>
        <div class="scenario-tabs" id="scenario-tabs">
          <!-- JS動的生成 -->
        </div>
      </div>
    </header>

    <!-- ガイド・アラートバー（元デザイン完全準拠・スリム設計） -->
    <div class="incident-alert type-guide" id="scenario-alert">
      <div class="incident-info">
        <h3 id="inc-title">シナリオタイトル</h3>
        <p id="inc-desc">シナリオの背景や目的の説明です。</p>
      </div>
      <button class="btn-reset" onclick="resetCurrentScenario()">
        <span>↺</span>
        <span>初期状態に戻す</span>
      </button>
    </div>

    <!-- メイン 3 カラムグリッド -->
    <div class="main-grid">
      <!-- 【左カラム】ファイル状態 -->
      <div class="col-zones">
        <div class="col-zones-title">
          <span>ファイル状態</span>
        </div>

        <!-- 領域1: 作業ツリー -->
        <div class="zone-box worktree">
          <div class="zone-header">
            <span class="zone-name">① 作業ツリー</span>
          </div>
          <div class="zone-file-list" id="wt-files">
            <span class="empty-note">変更なし</span>
          </div>
        </div>

        <!-- 領域2: ステージング -->
        <div class="zone-box staging">
          <div class="zone-header">
            <span class="zone-name">② ステージング</span>
          </div>
          <div class="zone-file-list" id="st-files">
            <span class="empty-note">空</span>
          </div>
        </div>

        <!-- 領域3: ローカルHEAD -->
        <div class="zone-box local">
          <div class="zone-header">
            <span class="zone-name">③ ローカルリポジトリ</span>
          </div>
          <div class="zone-file-list" id="loc-commit-files">
            <span class="empty-note">コミットなし</span>
          </div>
        </div>

        <!-- 領域4: リモート -->
        <div class="zone-box remote">
          <div class="zone-header">
            <span class="zone-name">④ リモートリポジトリ</span>
          </div>
          <div class="zone-file-list" id="rem-commit-files">
            <span class="empty-note">未接続</span>
          </div>
        </div>
      </div>

      <!-- 【中央カラム】コミットグラフ Canvas（縦全体を広く確保） -->
      <div class="col-canvas">
        <div class="card-header-canvas">
          <span class="card-title">コミットグラフ</span>
          <span id="graph-status-tag" style="font-size:0.78rem; font-weight:700; color:var(--text-sub);">進行中</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="git-canvas"></canvas>
        </div>
      </div>

      <!-- 【右カラム】実行手順ステップ一覧（480px） -->
      <div class="col-steps">
        <div class="card-steps-title">
          <span>実行手順（ステップ実行）</span>
          <span id="step-progress-tag" style="font-size:0.76rem; font-weight:700; color:#0284c7;">ステップ 1 / 4</span>
        </div>

        <div class="steps-list" id="steps-container">
          <!-- JSで動的生成 -->
        </div>

        <!-- 達成バナー -->
        <div class="success-banner" id="success-banner">
          <div style="font-size:1.1rem;">🎉</div>
          <div>
            <h4>ワークフロー完了！</h4>
            <p id="success-message">すべての操作が正常に完了しました。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- ベースとなる履歴（過去コミット） ---
    const baseCommits = [
      { id: "a10", msg: "feat: 初期環境構築", branch: "main", isRemote: true, files: ["package.json", "README.md"] },
      { id: "b20", msg: "feat: 共通UI基盤作成", branch: "main", isRemote: true, parent: "a10", files: ["package.json", "README.md", "app.css"] }
    ];

    // --- 厳選4シチュエーション（基本サイクル ＋ ブランチ動的変化） ---
    const scenarios = [
      {
        id: "flow_feature_cycle",
        tabTitle: "① 基本開発サイクル",
        category: "日常フロー",
        type: "guide",
        title: "フィーチャー開発の基本サイクル",
        desc: "main から新ブランチを作成し、機能開発を行ってローカルコミット・初回 Push する標準的なワークフローです。",
        initialState: () => ({
          commits: JSON.parse(JSON.stringify(baseCommits)),
          branches: { "main": "b20" },
          remotes: { "origin/main": "b20" },
          head: "main",
          workTree: ["new_feature.js"],
          staging: []
        }),
        steps: [
          {
            title: "新機能用ブランチを作成して切り替え",
            cmd: "git switch -c feature-cart",
            explanation: "main を汚さずに開発を進めるため、新ブランチ feature-cart を作成して移動します。",
            execute: (state) => {
              state.branches["feature-cart"] = state.branches["main"];
              state.head = "feature-cart";
            }
          },
          {
            title: "作成したファイルをステージングに追加",
            cmd: "git add new_feature.js",
            explanation: "コミット対象としてファイルをインデックスに登録します。",
            execute: (state) => {
              state.staging.push("new_feature.js");
              state.workTree = [];
            }
          },
          {
            title: "意味のある単位でローカルコミットを作成",
            cmd: "git commit -m \"feat: カート機能の基礎実装\"",
            explanation: "ステージングした変更をローカルリポジトリに確定記録します。",
            execute: (state) => {
              const newId = "c31";
              state.commits.push({
                id: newId,
                msg: "feat: カート機能の基礎実装",
                branch: "feature-cart",
                isRemote: false,
                parent: "b20",
                files: ["package.json", "README.md", "app.css", "new_feature.js"]
              });
              state.branches["feature-cart"] = newId;
              state.staging = [];
            }
          },
          {
            title: "上流ブランチを設定してリモートへ初回 Push",
            cmd: "git push -u origin feature-cart",
            explanation: "-u オプションで追跡関係を結び、リモートに feature-cart を作成します。",
            execute: (state) => {
              state.remotes["origin/feature-cart"] = state.branches["feature-cart"];
            }
          }
        ],
        successMsg: "フィーチャーブランチの作成から初回 Push まで、美しい開発サイクルが完了しました！"
      },
      {
        id: "flow_rebase_main",
        tabTitle: "② 履歴の直線化 (rebase)",
        category: "日常フロー",
        type: "guide",
        title: "最新 main を取り込んで履歴を直線化",
        desc: "作業中に main が更新されたため、2股に分岐したコミット [f21] を最新 main の直後へリベースして整えます。",
        initialState: () => ({
          commits: [
            ...JSON.parse(JSON.stringify(baseCommits)),
            { id: "m30", msg: "feat: 決済API追加", branch: "main", isRemote: true, parent: "b20", files: ["payment.js"] },
            { id: "f21", msg: "feat: カート画面作成", branch: "feature", isRemote: false, parent: "b20", files: ["cart.js"] }
          ],
          branches: { "main": "m30", "feature": "f21" },
          remotes: { "origin/main": "m30" },
          head: "feature",
          workTree: [],
          staging: []
        }),
        steps: [
          {
            title: "リモートの最新情報を取得（フェッチ）",
            cmd: "git fetch origin",
            explanation: "ローカルのファイルを変更せずに、リモート最新状態（m30）を確認・同期します。",
            execute: (state) => {}
          },
          {
            title: "最新の origin/main を基点にリベース実行",
            cmd: "git rebase origin/main",
            explanation: "自分のコミット [f21] を一時退避し、最新の [m30] の後ろへ直線的に付け直します。",
            execute: (state) => {
              const f = state.commits.find(c => c.id === "f21");
              if (f) f.parent = "m30";
            }
          },
          {
            title: "直線になった綺麗な履歴をリモートへ Push",
            cmd: "git push --force-with-lease origin feature",
            explanation: "リベース後の安全な強制プッシュで、綺麗な一本の履歴として更新します。",
            execute: (state) => {
              state.remotes["origin/feature"] = state.branches["feature"];
            }
          }
        ],
        successMsg: "マージコミットを作らず、最新 main の直後に綺麗にリベース完了しました！"
      },
      {
        id: "trouble_diverged_push",
        tabTitle: "③ 分岐プッシュ解決 (pull --rebase)",
        category: "トラブル解決",
        type: "trouble",
        title: "リモートと分岐して Push 拒否された状態の解消",
        desc: "リモートで別メンバーの更新 [r1a] が先に入っており、ローカル [l1a] と分岐して Push が弾かれた状態です。",
        initialState: () => ({
          commits: [
            ...JSON.parse(JSON.stringify(baseCommits)),
            { id: "r1a", msg: "docs: 別メンバーの更新", branch: "remote", isRemote: true, parent: "b20", files: ["README.md", "docs.md"] },
            { id: "l1a", msg: "feat: 自分のローカルコミット", branch: "main", isRemote: false, parent: "b20", files: ["app.js", "app.css"] }
          ],
          branches: { "main": "l1a" },
          remotes: { "origin/main": "r1a" },
          head: "main",
          workTree: [],
          staging: []
        }),
        steps: [
          {
            title: "pull --rebase でリモートの変更の後ろに付け替える",
            cmd: "git pull --rebase origin main",
            explanation: "マージコミットを作らず、自分のコミット [l1a] をリモート最新 [r1a] の直後へ移植して一本の直線に整えます。",
            execute: (state) => {
              const l1 = state.commits.find(c => c.id === "l1a");
              if (l1) l1.parent = "r1a";
            }
          },
          {
            title: "直線になった履歴をリモートへ Push する",
            cmd: "git push origin main",
            explanation: "分岐が解消されて直線になったため、弾かれることなくスムーズに Push が完了します。",
            execute: (state) => {
              state.remotes["origin/main"] = state.branches["main"];
            }
          }
        ],
        successMsg: "pull --rebase により履歴が一本の直線になり、無事にリモートへ Push 成功しました！"
      },
      {
        id: "trouble_main_commit",
        tabTitle: "④ mainコミット救出 (reset & branch)",
        category: "トラブル解決",
        type: "trouble",
        title: "誤って main で直接コミットした作業の救出",
        desc: "専用ブランチを作るのを忘れ、安定した main [b20] に未完成なコミット [w1a] を積んでしまった状態です。",
        initialState: () => ({
          commits: [
            ...JSON.parse(JSON.stringify(baseCommits)),
            { id: "w1a", msg: "feat: 未完成な作業コミット", branch: "main", isRemote: false, parent: "b20", files: ["new-feature.js"] }
          ],
          branches: { "main": "w1a" },
          remotes: { "origin/main": "b20" },
          head: "main",
          workTree: [],
          staging: []
        }),
        steps: [
          {
            title: "今のコミット位置に新しいブランチを作成する",
            cmd: "git branch feature-work",
            explanation: "現在コミット（未完成機能）の位置に新ブランチのラベルを貼り付けます。",
            execute: (state) => {
              state.branches["feature-work"] = state.branches["main"];
            }
          },
          {
            title: "main ブランチを Push 済みの位置まで巻き戻す",
            cmd: "git reset --hard origin/main",
            explanation: "main を綺麗なリモート同期地点 [b20] へ強制リセットします。新ブランチ側で保持しているので作業は消えません。",
            execute: (state) => {
              state.branches["main"] = state.remotes["origin/main"];
            }
          },
          {
            title: "新しく作ったブランチへ切り替えて作業継続",
            cmd: "git switch feature-work",
            explanation: "救出したコミットが存在する feature-work へ移動し、安全に開発を継続します。",
            execute: (state) => {
              state.head = "feature-work";
            }
          }
        ],
        successMsg: "main ブランチは綺麗な [b20] に戻り、作業は新ブランチ feature-work へ安全に救出されました！"
      }
    ];

    let currentScenarioIdx = 0;
    let currentStepIdx = 0;
    let currentState = null;
    let movedFiles = { workTree: [], staging: [], local: [], remote: [] };

    // --- 各領域の現在ファイル一覧を抽出するヘルパー ---
    function getZoneFiles(state) {
      if (!state) return { workTree: [], staging: [], local: [], remote: [] };
      const headId = state.branches[state.head] || state.head;
      const headCommit = state.commits.find(c => c.id === headId);
      const localFiles = headCommit && headCommit.files ? [...headCommit.files] : [];

      const rKey = Object.keys(state.remotes).find(k => k.includes(state.head)) || "origin/main";
      const rCommitId = state.remotes[rKey] || state.remotes["origin/main"];
      const rCommit = state.commits.find(c => c.id === rCommitId);
      const remoteFiles = rCommit && rCommit.files ? [...rCommit.files] : [];

      return {
        workTree: [...state.workTree],
        staging: [...state.staging],
        local: localFiles,
        remote: remoteFiles
      };
    }

    // --- シナリオ選択タブの描画 ---
    function renderTabs() {
      const tabsEl = document.getElementById("scenario-tabs");
      tabsEl.innerHTML = "";

      scenarios.forEach((sc, idx) => {
        const btn = document.createElement("button");
        btn.className = `scenario-tab-btn ${idx === currentScenarioIdx ? 'active' : ''} ${sc.type === 'trouble' ? 'trouble' : ''}`;
        btn.textContent = sc.tabTitle;
        btn.onclick = () => selectScenario(idx);
        tabsEl.appendChild(btn);
      });
    }

    // --- シナリオ切り替え ---
    function selectScenario(idx) {
      if (idx < 0 || idx >= scenarios.length) return;
      currentScenarioIdx = idx;
      currentStepIdx = 0;
      currentState = scenarios[idx].initialState();
      movedFiles = { workTree: [], staging: [], local: [], remote: [] };

      renderTabs();

      const sc = scenarios[idx];
      const alertBox = document.getElementById("scenario-alert");
      alertBox.className = `incident-alert ${sc.type === 'trouble' ? 'type-trouble' : 'type-guide'}`;

      document.getElementById("inc-title").textContent = sc.title;
      document.getElementById("inc-desc").textContent = sc.desc;

      const bannerEl = document.getElementById("success-banner");
      bannerEl.style.display = "none";

      const statusTag = document.getElementById("graph-status-tag");
      statusTag.textContent = "進行中";
      statusTag.style.color = "var(--text-sub)";

      renderSteps();
      updateZonesUI();
      drawGraph();
    }

    function resetCurrentScenario() {
      selectScenario(currentScenarioIdx);
    }

    // --- ステップ実行（ファイル移動検知 ＆ 赤枠ハイライト） ---
    function executeCurrentStep() {
      const sc = scenarios[currentScenarioIdx];
      if (!sc || currentStepIdx >= sc.steps.length) return;

      const step = sc.steps[currentStepIdx];
      const before = getZoneFiles(currentState);

      step.execute(currentState);

      const after = getZoneFiles(currentState);

      // 前後比較：新しくその領域に移動・追加されたファイルを特定
      movedFiles = {
        workTree: after.workTree.filter(f => !before.workTree.includes(f)),
        staging: after.staging.filter(f => !before.staging.includes(f)),
        local: after.local.filter(f => !before.local.includes(f)),
        remote: after.remote.filter(f => !before.remote.includes(f))
      };

      currentStepIdx++;

      if (currentStepIdx >= sc.steps.length) {
        const banner = document.getElementById("success-banner");
        const msg = document.getElementById("success-message");
        if (msg) msg.textContent = sc.successMsg;
        if (banner) banner.style.display = "flex";

        const statusTag = document.getElementById("graph-status-tag");
        statusTag.textContent = "✔ 完了";
        statusTag.style.color = "#15803d";
      }

      renderSteps();
      updateZonesUI();
      drawGraph();
    }

    // --- 実行手順ステップ一覧の描画（タイトル行全幅 ＋ コマンド横アクション） ---
    function renderSteps() {
      const sc = scenarios[currentScenarioIdx];
      const container = document.getElementById("steps-container");
      if (!container || !sc) return;
      container.innerHTML = "";

      const progressTag = document.getElementById("step-progress-tag");
      progressTag.textContent = `ステップ ${Math.min(currentStepIdx + 1, sc.steps.length)} / ${sc.steps.length}`;

      sc.steps.forEach((step, idx) => {
        const isCompleted = idx < currentStepIdx;
        const isActive = idx === currentStepIdx;

        const card = document.createElement("div");
        card.className = `step-card ${isCompleted ? "completed" : ""} ${isActive ? "active" : ""}`;

        let actionBtnHtml = "";
        if (isActive) {
          actionBtnHtml = `<button class="btn-exec" onclick="executeCurrentStep()">▶ 実行</button>`;
        } else if (isCompleted) {
          actionBtnHtml = `<span class="step-status-done">✓ 完了</span>`;
        } else {
          actionBtnHtml = `<button class="btn-exec" disabled>待機中</button>`;
        }

        card.innerHTML = `
          <div class="step-header">
            <span class="step-number">${isCompleted ? "✓" : idx + 1}</span>
            <span class="step-title-text">手順 ${idx + 1}: ${step.title}</span>
          </div>
          <div class="step-action-row">
            <div class="step-code">
              <span>$ ${step.cmd}</span>
            </div>
            ${actionBtnHtml}
          </div>
          <div class="step-explanation">${step.explanation}</div>
        `;

        container.appendChild(card);
      });
    }

    // --- 左カラム ファイル状態 UI更新（移動ファイルに .moved 付与） ---
    function updateZonesUI() {
      if (!currentState) return;

      // 1. 作業ツリー
      const wtBox = document.getElementById("wt-files");
      if (currentState.workTree.length === 0) {
        wtBox.innerHTML = `<span class="empty-note">変更なし</span>`;
      } else {
        wtBox.innerHTML = currentState.workTree.map(f => {
          const isMoved = movedFiles.workTree.includes(f);
          return `<div class="file-chip ${isMoved ? 'moved' : ''}">📄 ${f}</div>`;
        }).join("");
      }

      // 2. ステージング
      const stBox = document.getElementById("st-files");
      if (currentState.staging.length === 0) {
        stBox.innerHTML = `<span class="empty-note">空</span>`;
      } else {
        stBox.innerHTML = currentState.staging.map(f => {
          const isMoved = movedFiles.staging.includes(f);
          return `<div class="file-chip ${isMoved ? 'moved' : ''}">📄 ${f}</div>`;
        }).join("");
      }

      // 3. ローカル HEAD コミット
      const headCommitId = currentState.branches[currentState.head] || currentState.head;
      const headCommit = currentState.commits.find(c => c.id === headCommitId);
      const locBox = document.getElementById("loc-commit-files");

      if (locBox) {
        if (headCommit && headCommit.files) {
          locBox.innerHTML = `
            <div style="font-size:0.72rem; font-weight:bold; color:#0369a1; margin-bottom:0.1rem;">
              [${headCommit.id}] ${headCommit.msg}
            </div>
            ${headCommit.files.map(f => {
              const isMoved = movedFiles.local.includes(f);
              return `<div class="file-chip ${isMoved ? 'moved' : ''}">📦 ${f}</div>`;
            }).join("")}
          `;
        } else {
          locBox.innerHTML = `<span class="empty-note">コミットなし</span>`;
        }
      }

      // 4. リモート
      const rKey = Object.keys(currentState.remotes).find(k => k.includes(currentState.head)) || "origin/main";
      const rCommitId = currentState.remotes[rKey] || currentState.remotes["origin/main"];
      const rCommit = currentState.commits.find(c => c.id === rCommitId);
      const remBox = document.getElementById("rem-commit-files");

      if (remBox) {
        if (rCommit && rCommit.files) {
          remBox.innerHTML = `
            <div style="font-size:0.72rem; font-weight:bold; color:#7e22ce; margin-bottom:0.1rem;">
              [${rCommit.id}] ${rCommit.msg}
            </div>
            ${rCommit.files.map(f => {
              const isMoved = movedFiles.remote.includes(f);
              return `<div class="file-chip ${isMoved ? 'moved' : ''}">☁️ ${f}</div>`;
            }).join("")}
          `;
        } else {
          remBox.innerHTML = `<span class="empty-note">未接続</span>`;
        }
      }
    }

    // --- 中央 Canvas コミットグラフ描画（視認性向上・拡大版） ---
    function drawGraph() {
      const canvas = document.getElementById("git-canvas");
      if (!canvas || !currentState) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, rect.width, rect.height);

      const commitList = currentState.commits;
      if (!commitList || commitList.length === 0) return;

      const nodeRadius = 26;
      const startX = 75;
      const stepX = Math.min(170, (rect.width - 150) / Math.max(1, commitList.length - 1));
      const centerY = rect.height / 2;

      // コミットごとのY座標オフセット計算
      const coords = {};
      const branchOffset = Math.min(60, rect.height * 0.22);

      commitList.forEach((c, idx) => {
        let y = centerY;
        // 1. flow_feature_cycle
        if (c.id === "c31" || c.branch === "feature-cart") y = centerY - branchOffset;

        // 2. flow_rebase_main
        if (c.id === "m30") y = centerY - branchOffset;
        if (c.id === "f21") {
          y = (c.parent === "m30") ? centerY - branchOffset : centerY + branchOffset;
        }

        // 3. trouble_diverged_push
        if (c.id === "r1a") y = centerY - branchOffset;
        if (c.id === "l1a") {
          y = (c.parent === "r1a") ? centerY - branchOffset : centerY + branchOffset;
        }

        // 4. trouble_main_commit
        if (c.id === "w1a") y = centerY;

        coords[c.id] = { x: startX + idx * stepX, y };
      });

      // 1. エッジ（矢印）描画
      commitList.forEach(c => {
        if (c.parent && coords[c.parent] && coords[c.id]) {
          const from = coords[c.parent];
          const to = coords[c.id];

          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(from.x + nodeRadius, from.y);
          ctx.lineTo(to.x - nodeRadius, to.y);
          ctx.stroke();

          const angle = Math.atan2(to.y - from.y, to.x - from.x);
          ctx.fillStyle = "#94a3b8";
          ctx.beginPath();
          ctx.moveTo(to.x - nodeRadius, to.y);
          ctx.lineTo(to.x - nodeRadius - 10 * Math.cos(angle - Math.PI / 6), to.y - 10 * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(to.x - nodeRadius - 10 * Math.cos(angle + Math.PI / 6), to.y - 10 * Math.sin(angle + Math.PI / 6));
          ctx.fill();
        }
      });

      // 2. コミットノード描画
      const headCommitId = currentState.branches[currentState.head] || currentState.head;

      commitList.forEach(c => {
        const coord = coords[c.id];
        if (!coord) return;
        const { x, y } = coord;
        const isHead = c.id === headCommitId;

        // ノード本体
        ctx.beginPath();
        ctx.arc(x, y, nodeRadius, 0, Math.PI * 2);
        ctx.fillStyle = isHead ? "#dcfce7" : (c.isRemote ? "#faf5ff" : "#ffffff");
        ctx.fill();

        ctx.strokeStyle = isHead ? "#16a34a" : (c.isRemote ? "#9333ea" : "#64748b");
        ctx.lineWidth = isHead ? 3.5 : 2;
        ctx.stroke();

        // コミットID
        ctx.fillStyle = isHead ? "#15803d" : (c.isRemote ? "#6b21a8" : "#1e293b");
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "center";
        ctx.fillText(c.id, x, y + 5);

        // コミットメッセージ
        ctx.fillStyle = isHead ? "#0f172a" : "#475569";
        ctx.font = isHead ? "bold 13px sans-serif" : "600 13px sans-serif";
        const shortMsg = c.msg.length > 13 ? c.msg.substring(0, 11) + "…" : c.msg;
        ctx.fillText(shortMsg, x, y + nodeRadius + 18);

        // 3. ブランチ・HEADタグ描画
        const tags = [];
        const currentHeadBranch = currentState.head;

        const branchNames = [];
        for (const [b, id] of Object.entries(currentState.branches)) {
          if (id === c.id) branchNames.push(b);
        }

        const remoteNames = [];
        for (const [r, id] of Object.entries(currentState.remotes)) {
          if (id === c.id) remoteNames.push(r);
        }

        if (isHead) {
          if (branchNames.includes(currentHeadBranch)) {
            tags.push({ text: `HEAD -> ${currentHeadBranch}`, color: "#15803d", bg: "#dcfce7", border: "#16a34a" });
            branchNames.filter(b => b !== currentHeadBranch).forEach(b => {
              tags.push({ text: b, color: "#0369a1", bg: "#e0f2fe", border: "#7dd3fc" });
            });
          } else {
            tags.push({ text: "HEAD", color: "#15803d", bg: "#dcfce7", border: "#16a34a" });
            branchNames.forEach(b => {
              tags.push({ text: b, color: "#0369a1", bg: "#e0f2fe", border: "#7dd3fc" });
            });
          }
        } else {
          branchNames.forEach(b => {
            tags.push({ text: b, color: "#0369a1", bg: "#e0f2fe", border: "#7dd3fc" });
          });
        }

        remoteNames.forEach(r => {
          tags.push({ text: r, color: "#7e22ce", bg: "#f3e8ff", border: "#c084fc" });
        });

        tags.forEach((t, tIdx) => {
          const tagY = y - nodeRadius - 12 - tIdx * 22;
          ctx.font = "bold 12px monospace";
          const tw = ctx.measureText(t.text).width + 14;

          ctx.fillStyle = t.bg;
          ctx.strokeStyle = t.border || t.color;
          ctx.lineWidth = 1.3;
          ctx.fillRect(x - tw / 2, tagY - 11, tw, 18);
          ctx.strokeRect(x - tw / 2, tagY - 11, tw, 18);

          ctx.fillStyle = t.color;
          ctx.fillText(t.text, x, tagY + 2);
        });
      });
    }

    window.addEventListener("load", () => {
      selectScenario(0);
    });

    window.addEventListener("resize", () => {
      drawGraph();
    });
  </script>
