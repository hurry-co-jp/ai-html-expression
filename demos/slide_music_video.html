  <script>
    'use strict';
    (() => {
      const $ = id => document.getElementById(id);
      const DURATION = 64, BPM = 120, BEAT = 60 / BPM, W = 1920, H = 1080, TAU = Math.PI * 2;
      const C = { ink: '#172436', blue: '#3055e9', coral: '#ef7755', mint: '#28a88e', pale: '#eff3ff', muted: '#718096', line: '#dbe3ed' };
      const FONT = '"Hiragino Sans", "Yu Gothic", Meiryo, sans-serif';
      const MONO = 'Consolas, "Liberation Mono", monospace';
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const mix = (a, b, t) => a + (b - a) * t;
      const ease = v => 1 - Math.pow(1 - clamp(v), 3);
      const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
      let minimalMotion = motionPreference.matches;
      const chapters = [
        { start: 0, end: 8, name: '表紙', caption: 'AIでHTMLにどこまで表現させられるかやってみた。テキストによる思考整理から、HTMLの表現へ。' },
        { start: 8, end: 12, name: '自己紹介', caption: '自己紹介のタイトル演出。元スライドの参照画像がないため、人物情報は追加していません。' },
        { start: 12, end: 20, name: '問いかけ', caption: 'みなさん、資料はどうやって作っていますか？ Markdown？ PowerPoint？ 今回はHTMLの表現を試してみた話。' },
        { start: 20, end: 28, name: '目次', caption: 'Markdownとは。なぜAIでHTMLを作らせるのか。思考サイクル。やってみた感想。デモ紹介。まとめ。' },
        { start: 28, end: 40, name: '着想', caption: 'MarkdownはHTMLの簡易記述。変換をAIに任せたら、本来のHTMLの表現をもっと活用できるのでは？' },
        { start: 40, end: 52, name: '変換', caption: 'プレーンテキスト、Markdown、HTML。同じ内容が、簡易記法からHTMLの構造へ変わる。' },
        { start: 52, end: 64, name: 'プレビュー', caption: 'AWSコスト自動集計の検討案を例に、Markdownの見出し・箇条書き・図が、HTMLと構成図になる様子を再現。' }
      ];

      // 曲は32小節。映像のカットも同じ拍・小節から時刻を求める。
      const chords = [[48, 52, 55, 59], [43, 47, 50, 54], [50, 54, 57, 62], [40, 43, 47, 50]];
      const melodies = [
        [76, null, 79, 83, 81, 79, 76, null], [79, 76, 74, null, 76, 79, 83, 79],
        [74, null, 79, 78, 74, 71, 74, null], [71, 74, 78, 79, 78, 74, 71, null],
        [78, null, 81, 86, 83, 81, 78, null], [81, 78, 76, null, 78, 81, 83, 81],
        [79, null, 83, 81, 79, 76, 74, null], [76, 79, 83, 86, 83, 79, 76, null]
      ];
      const score = [];
      function event(at, type, note = 0, duration = .2, velocity = 1) { score.push({ at, type, note, duration, velocity }); }
      for (let bar = 0; bar < 32; bar++) {
        const at = bar * 2, chord = chords[Math.floor(bar / 2) % 4];
        const intro = bar < 4, build = bar >= 10 && bar < 14, drop = bar >= 14 && bar < 20;
        const breakdown = bar >= 20 && bar < 22, ending = bar >= 30;
        chord.forEach(note => event(at, 'pad', note + 12, 2.6, intro ? .7 : .5));
        if (!ending) {
          for (let step = 0; step < 8; step++) {
            if (breakdown && step % 2) continue;
            const note = chord[[0, 1, 2, 3, 2, 1, 3, 2][step]] + 24;
            event(at + step * .25, 'pluck', note, .28, intro ? .65 : .38);
          }
        }
        if (bar >= 2 && !breakdown && !ending) {
          for (let beat = 0; beat < 4; beat++) {
            event(at + beat * BEAT, 'kick', 0, .28, intro ? .55 : 1);
            if (beat % 2) event(at + beat * BEAT, 'snare', 0, .18, .8);
            event(at + beat * BEAT + .25, 'hat', 0, .07, .45);
          }
          if (bar >= 4) {
            for (let step = 0; step < 8; step++) {
              if (step === 3 || step === 7) continue;
              event(at + step * .25, 'bass', chord[0] - 12 + (step === 6 ? 12 : 0), .19, .7);
            }
          }
          if (drop || bar >= 24) for (let step = 0; step < 16; step++) if (step % 2 === 0) event(at + step * .125, 'hat', 0, .045, .19);
        }
        if (bar >= 6 && !build && !breakdown && !ending) {
          melodies[bar % 8].forEach((note, i) => {
            if (note !== null) event(at + i * .25, 'lead', note, i === 7 ? .38 : .23, drop || bar >= 24 ? .7 : .43);
          });
        }
        if (build) {
          const interval = bar < 12 ? .5 : bar === 12 ? .25 : .125;
          for (let t = 0; t < 2; t += interval) event(at + t, 'snare', 0, .09, .2 + (bar - 10) * .12);
          event(at, 'riser', 0, 1.9, .3 + (bar - 10) * .1);
        }
        if ([0, 4, 6, 10, 14, 20, 22, 26, 30].includes(bar)) event(at, 'shimmer', 0, 1.4, .45);
      }
      [52, 55, 59, 64, 71, 76].forEach(note => event(60, 'pad', note, 3.8, .55));
      [83, 79, 76].forEach((note, i) => event(60 + i * .5, 'lead', note, 1.2, .5));
      event(60, 'kick', 0, .3, .8);
      score.sort((a, b) => a.at - b.at);

      class Soundtrack {
        constructor() {
          this.ctx = null; this.master = null; this.session = null; this.sources = new Set();
          this.volume = .55; this.muted = false; this.index = 0; this.analyser = null;
        }
        async init() {
          if (!this.ctx) {
            const Audio = window.AudioContext || window.webkitAudioContext;
            if (!Audio) throw new Error('音声合成が利用できません');
            this.ctx = new Audio();
            this.master = this.ctx.createGain();
            this.master.gain.value = this.muted ? 0 : this.volume * .65;
            const compressor = this.ctx.createDynamicsCompressor();
            compressor.threshold.value = -19; compressor.knee.value = 14; compressor.ratio.value = 5;
            compressor.attack.value = .006; compressor.release.value = .15;
            this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 256;
            this.master.connect(compressor); compressor.connect(this.analyser); this.analyser.connect(this.ctx.destination);
            this.spectrum = new Uint8Array(this.analyser.frequencyBinCount);
            this.noise = this.ctx.createBuffer(1, this.ctx.sampleRate * 3, this.ctx.sampleRate);
            const data = this.noise.getChannelData(0);
            let seed = 571;
            for (let i = 0; i < data.length; i++) { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; data[i] = seed / 2147483648 - 1; }
          }
          if (this.ctx.state !== 'running') await this.ctx.resume();
          if (this.ctx.state !== 'running') throw new Error('音声の再生を開始できません');
        }
        gain(value, at, duration, destination, attack = .008) {
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(.0001, at);
          gain.gain.exponentialRampToValueAtTime(Math.max(.0002, value), at + Math.min(attack, duration * .2));
          gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
          gain.connect(destination);
          return gain;
        }
        track(source, at, duration, cleanup = []) {
          this.sources.add(source);
          source.onended = () => { this.sources.delete(source); source.disconnect(); cleanup.forEach(node => node.disconnect()); };
          source.start(at); source.stop(at + duration + .03);
        }
        tone(note, at, duration, volume, type = 'triangle', cutoff = 2500, detune = 0) {
          const oscillator = this.ctx.createOscillator();
          oscillator.type = type; oscillator.frequency.value = 440 * Math.pow(2, (note - 69) / 12); oscillator.detune.value = detune;
          const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = cutoff;
          const gain = this.gain(volume, at, duration, this.session.input, type === 'sine' ? .03 : .008);
          oscillator.connect(filter); filter.connect(gain);
          this.track(oscillator, at, duration, [filter, gain]);
        }
        noiseHit(at, duration, volume, frequency, type = 'highpass') {
          const source = this.ctx.createBufferSource(); source.buffer = this.noise;
          const filter = this.ctx.createBiquadFilter(); filter.type = type; filter.frequency.value = frequency;
          const gain = this.gain(volume, at, duration, this.session.input);
          source.connect(filter); filter.connect(gain);
          this.track(source, at, duration, [filter, gain]);
        }
        playNote(item, when, remaining = item.duration) {
          if (!this.session) return;
          const at = Math.max(this.ctx.currentTime + .002, when), v = item.velocity, d = remaining;
          if (item.type === 'kick') {
            const oscillator = this.ctx.createOscillator(); oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(150, at); oscillator.frequency.exponentialRampToValueAtTime(44, at + .13);
            const gain = this.gain(.72 * v, at, d, this.session.input, .004);
            oscillator.connect(gain); this.track(oscillator, at, d, [gain]);
          } else if (item.type === 'snare') {
            this.noiseHit(at, d, .23 * v, 1600);
            this.tone(50, at, .08, .11 * v, 'triangle', 1300);
          } else if (item.type === 'hat') {
            this.noiseHit(at, d, .13 * v, 7200);
          } else if (item.type === 'bass') {
            this.tone(item.note, at, d, .28 * v, 'triangle', 750);
            this.tone(item.note, at, d, .18 * v, 'sine', 500);
          } else if (item.type === 'pad') {
            const oscillator = this.ctx.createOscillator(); oscillator.type = 'triangle';
            oscillator.frequency.value = 440 * Math.pow(2, (item.note - 69) / 12);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(.0001, at); gain.gain.linearRampToValueAtTime(.055 * v, at + Math.min(.38, d * .2));
            gain.gain.setValueAtTime(.045 * v, at + d * .55); gain.gain.exponentialRampToValueAtTime(.0001, at + d);
            oscillator.connect(gain); gain.connect(this.session.input); gain.connect(this.session.send);
            this.track(oscillator, at, d, [gain]);
          } else if (item.type === 'lead' || item.type === 'pluck') {
            this.tone(item.note, at, d, (item.type === 'lead' ? .14 : .075) * v, 'triangle', 3200);
            this.tone(item.note + 12, at, d * .65, .025 * v, 'sine', 4000);
            if (item.type === 'lead') this.tone(item.note, at + .1875, d * .7, .035 * v, 'sine', 2300);
          } else if (item.type === 'shimmer') {
            this.noiseHit(at, d, .12 * v, 6000);
          } else if (item.type === 'riser') {
            const source = this.ctx.createBufferSource(); source.buffer = this.noise;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.Q.value = .8;
            filter.frequency.setValueAtTime(400, at); filter.frequency.exponentialRampToValueAtTime(6500, at + d);
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(.0001, at); gain.gain.linearRampToValueAtTime(.11 * v, at + d * .85); gain.gain.linearRampToValueAtTime(0, at + d);
            source.connect(filter); filter.connect(gain); gain.connect(this.session.input); this.track(source, at, d, [filter, gain]);
          }
        }
        begin(position) {
          this.stop();
          const input = this.ctx.createGain(), send = this.ctx.createGain(), delay = this.ctx.createDelay(1), feedback = this.ctx.createGain();
          input.gain.value = 1; send.gain.value = .26; delay.delayTime.value = .375; feedback.gain.value = .25;
          input.connect(this.master); send.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(input);
          this.session = { input, send, delay, feedback };
          this.origin = this.ctx.currentTime + .045 - position;
          this.index = score.findIndex(item => item.at >= position - .001);

            if (i) { line(x - 145, 840, x - 105, 840, C.blue, 3); line(x - 116, 832, x - 105, 840, C.blue, 3); line(x - 116, 848, x - 105, 840, C.blue, 3); }
            rect(x - 100, 807, 200, 66, '#edf2ff', 12, '#b9c9f7'); text(name, x, 840, 24, C.blue, 600, 'center', MONO);
          });
          ctx.restore();
        }
        if (!minimalMotion) {
          const f = (t * 1.2) % 1;
          circle(mix(935, 985, f), 590, 4 + Math.sin(f * Math.PI) * 4, C.blue, true);
        }
      }
      const painters = [sceneCover, sceneProfile, sceneQuestion, sceneAgenda, sceneIdea, sceneTransform, scenePreview];
      function draw(t) {
        const nextScene = chapters.findIndex(chapter => t < chapter.end);
        const sceneIndex = nextScene < 0 ? 6 : nextScene;
        const scene = chapters[sceneIndex], age = t - scene.start;
        const { w, h, dpr } = viewport;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#f9faff'; ctx.fillRect(0, 0, w, h);
        const scale = Math.min(w / W, h / H);
        ctx.save(); ctx.translate((w - W * scale) / 2, (h - H * scale) / 2); ctx.scale(scale, scale);
        ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
        backdrop(t, sceneIndex);
        const effectiveAge = !state.started && sceneIndex === 0 ? 3 : age;
        painters[sceneIndex](t, effectiveAge);
        // 短い斜めのワイプで拍の境界をつなぐ。白黒の点滅は使わない。
        if (!minimalMotion && state.started && age < .32 && sceneIndex > 0) {
          const p = age / .32;
          ctx.save(); ctx.translate(mix(-700, 2400, p), 0); ctx.transform(1, 0, -.3, 1, 0, 0);
          rect(0, 0, 520, H, '#dce5ff'); rect(520, 0, 42, H, C.coral); ctx.restore();
        }
        ctx.restore();
        if (sceneIndex !== state.scene) {
          state.scene = sceneIndex;
          $('chapter-name').textContent = `0${sceneIndex + 1} / ${scene.name}`;
          $('scene-description').textContent = `P${sceneIndex + 1} ${scene.name}。${scene.caption}`;
          document.querySelectorAll('.chapter').forEach((button, index) => button.setAttribute('aria-current', String(index === sceneIndex)));
        }
        const sec = Math.floor(t);
        $('elapsed').textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
        $('seek').value = t;
        $('seek').setAttribute('aria-valuetext', `${Math.floor(sec / 60)}分${sec % 60}秒 / 1分4秒`);
        document.querySelectorAll('.beat-meter i').forEach((dot, index) => dot.classList.toggle('active', state.playing && index === Math.floor(t / BEAT) % 4));
      }
      function invalidate() { if (frameId === null) frameId = requestAnimationFrame(frame); }
      function frame(timestamp) {
        frameId = null;
        let t = time();
        if (t >= DURATION && state.playing) {
          state.position = DURATION; state.playing = false; sound.stop(); updatePlayUI();
          $('status').textContent = '再生が終わりました。再生ボタンでもう一度、チャプターから各場面へ戻れます。';
        }
        if (!minimalMotion || !state.playing || timestamp - lastPaint >= 120) { draw(t); lastPaint = timestamp; }
        if (state.playing) invalidate();
      }
      function resize() {
        const box = canvas.getBoundingClientRect();
        viewport = { w: box.width, h: box.height, dpr: Math.min(devicePixelRatio || 1, 2) };
        canvas.width = Math.round(viewport.w * viewport.dpr); canvas.height = Math.round(viewport.h * viewport.dpr); invalidate();
      }
      new ResizeObserver(resize).observe($('screen'));
      resize(); updatePlayUI();
    })();
  </script>
</body>
</html>
