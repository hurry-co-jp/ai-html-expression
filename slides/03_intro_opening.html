<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オープニング</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/slide.js"></script>
  <style>
    .opening-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5rem;
      padding: 1rem 2rem;
    }
    .question-box {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04);
    }
    .question-box h2 {
      font-size: 3.2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 1.25rem;
      line-height: 1.3;
    }
    .question-box p {
      font-size: 2.2rem;
      color: #475569;
      font-weight: 600;
    }
    .down-arrow {
      text-align: center;
      font-size: 2.8rem;
      color: #0284c7;
      font-weight: bold;
    }
    .theme-box {
      background: #f0f9ff;
      border: 2px solid #0284c7;
      border-radius: 1.25rem;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08);
    }
    .theme-box p {
      font-size: 2.45rem;
      font-weight: 800;
      color: #0284c7;
      line-height: 1.35;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <header class="slide-header">
      <h1>オープニング</h1>
      <div class="slide-logo"></div>
    </header>

    <main class="slide-content opening-wrapper">
      <div class="question-box">
        <h2>みなさん、資料はどうやって作っていますか？</h2>
        <p>Markdown？ PowerPoint？</p>
      </div>

      <div class="down-arrow">▼</div>

      <div class="theme-box">
        <p>今回は、HTMLでどのような表現が可能なのかについて試してみた話をします</p>
      </div>
    </main>

    <footer class="slide-footer"></footer>
  </div>
</body>
</html>
